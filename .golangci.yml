version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose      # unclosed HTTP response bodies leak connections
    - errorlint      # correct error wrapping and comparison
    - gocritic
    - gosec          # security issues, which this project cares about specifically
    - misspell
    - nilerr         # returning nil after a non-nil error
    - revive
    - rowserrcheck   # unchecked rows.Err() after iterating query results
    - sqlclosecheck
    - unconvert
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          disabled: true   # not a public library; doc comments on every export add noise
    gosec:
      excludes:
        - G104           # covered by errcheck, which is part of the standard set

  exclusions:
    rules:
      # Tests may hardcode credentials and skip a few strictness checks.
      - path: _test\.go
        linters: [gosec, errcheck]
      # sqlc output is generated; linting it is not actionable.
      - path: db/generated/
        linters: [revive, gocritic, unconvert, gosec]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
