name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  quality:
    name: Vet, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Hosted runners share IPs, so anonymous Docker Hub pulls of library/postgres
        # are rate-limited before any step runs. Same official image, public mirror.
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus_test_password
          POSTGRES_DB: nimbus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbus_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://nimbus:nimbus_test_password@localhost:5432/nimbus_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test with race detector
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -n 1

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nimbus-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
